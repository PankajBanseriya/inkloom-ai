# ===================================================================
# Inkloom AI - Spring Boot Configuration
# ===================================================================
server.port=8080
spring.application.name=inkloom-backend

# MongoDB Configuration
# Configurable via MONGODB_URI environment variable (Local MongoDB or MongoDB Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/inkloom?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=false

# JWT Security Configuration
# Stored in environment variable INKLOOM_JWT_SECRET (default dev secret provided for local tests)
inkloom.jwt.secret=${INKLOOM_JWT_SECRET:inkloom_development_secret_key_minimum_256_bits_for_hmac_sha256_secure_key_12345}
inkloom.jwt.expiration-ms=${INKLOOM_JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Google Gemini AI Integration (Official Google Gen AI Java SDK)
# ===================================================================
# AI feature enabled flag (default false to allow deterministic execution and offline tests)
inkloom.ai.gemini.enabled=${GEMINI_ENABLED:${AI_FEATURE_ENABLED:false}}

# Official Google API Key (reads from GOOGLE_API_KEY environment variable)
inkloom.ai.gemini.api-key=${GOOGLE_API_KEY:}

# Official Google Gemini Model (default: gemini-2.5-flash for fast reasoning and structured outputs)
inkloom.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Request timeout in seconds
inkloom.ai.gemini.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# Input character and output token limits
inkloom.ai.gemini.max-input-chars=${AI_MAX_INPUT_CHARS:50000}
inkloom.ai.gemini.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:4096}
inkloom.ai.gemini.temperature=${AI_TEMPERATURE:0.2}

# CORS Configuration
inkloom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.inkloom=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
