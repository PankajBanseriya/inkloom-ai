# ===================================================================
# Inkloom AI - Spring Boot Configuration
# ===================================================================
server.port=8080
spring.application.name=inkloom-backend

# MongoDB Configuration
# Configurable via MONGODB_URI environment variable (Local MongoDB or MongoDB Atlas)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/inkloom?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.auto-index-creation=false

# JWT Security Configuration
# Stored in environment variable INKLOOM_JWT_SECRET (default dev secret provided for local tests)
inkloom.jwt.secret=${INKLOOM_JWT_SECRET:inkloom_development_secret_key_minimum_256_bits_for_hmac_sha256_secure_key_12345}
inkloom.jwt.expiration-ms=${INKLOOM_JWT_EXPIRATION_MS:86400000}

# AI Engine Configuration
# Supported providers: gemini, openai, none (deterministic fallback)
inkloom.ai.provider=${INKLOOM_AI_PROVIDER:none}
inkloom.ai.api-key=${INKLOOM_AI_API_KEY:}
inkloom.ai.timeout-ms=${INKLOOM_AI_TIMEOUT_MS:15000}

# CORS Configuration
inkloom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.inkloom=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
